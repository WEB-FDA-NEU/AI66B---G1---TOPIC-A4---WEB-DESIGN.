<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Details — Concertly</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/utilitites.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/me.css" />
    <script src="../../js/mock-data.js"></script>
    <script src="../../js/me.js"></script>
  </head>
  <body>
    <div class="shell">
      <!-- ============ Shared site nav ============ -->
      <header class="site-header">
        <div class="container">
          <a href="../../index.html" class="site-logo hover-glow">CONCERTLY</a>
          <div class="header-actions" data-home="../../index.html">
            <nav class="site-nav">
              <a href="../../index.html" class="hover-glow" data-nav>Home</a>
              <a href="../concerts/index.html" class="hover-glow" data-nav
                >Explore</a
              >
              <a href="../404.html" class="hover-glow" data-nav>Support</a>
              <span class="nav-indicator"></span>
            </nav>
            <form
              class="header-search"
              action="../concerts/index.html"
              method="get"
              role="search"
            >
              <input
                class="header-search-input"
                type="search"
                name="search"
                placeholder="Find your next live show..."
                aria-label="Search concerts"
              />
              <button
                class="header-search-button"
                type="submit"
                aria-label="Search"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="m20 20-4-4"></path>
                </svg>
              </button>
            </form>
            <div class="site-auth">
              <button
                class="avatar-button"
                type="button"
                aria-label="Account menu"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="8" r="3.5"></circle>
                  <path d="M5.5 20c.8-3.2 3.1-5 6.5-5s5.7 1.8 6.5 5"></path>
                </svg>
              </button>
              <div class="auth-menu" role="menu">
                <a href="../auth/login.html" data-auth-login role="menuitem"
                  >Sign in</a
                >
                <a href="../auth/register.html" role="menuitem">Sign up</a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="account-main">
        <div class="container">
          <div class="page-head" style="padding-bottom: 0">
            <div>
              <div class="breadcrumb">
                <a href="orders.html">My Orders</a><span>/</span
                ><span id="crumbId"></span>
              </div>
              <h1 id="orderTitle">Order details</h1>
            </div>
            <span class="badge" id="statusBadge"></span>
          </div>

          <div style="height: 24px"></div>

          <div class="detail-grid" id="detailGrid"></div>
        </div>
      </main>
    </div>

    <script>
      const icoCalendar = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
      const icoPin = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.6"/></svg>`;
      const icoTicket = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a1.8 1.8 0 0 0 0 3.6V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.4a1.8 1.8 0 0 0 0-3.6V8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 6v12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/></svg>`;
      const icoCard = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg>`;

      /* ---- resolve order id from ?id= query param, default to most recent order ---- */
      const params = new URLSearchParams(window.location.search);
      const pathOrderId = window.location.pathname
        .split("/")
        .filter(Boolean)
        .pop();
      const requestedId =
        params.get("id") ||
        (pathOrderId && pathOrderId !== "order-detail.html"
          ? decodeURIComponent(pathOrderId)
          : null);
      const order = requestedId ? getOrderById(requestedId) : MOCK_ORDERS[0];

      function render() {
        if (!order) {
          document.title = "Order not found — Concertly";
          document.getElementById("crumbId").textContent = requestedId;
          document.getElementById("orderTitle").textContent = "Order not found";
          document.getElementById("statusBadge").hidden = true;
          document.getElementById("detailGrid").innerHTML = `
            <div class="empty empty--detail">
              <h3>We couldn't find that order</h3>
              <p>Check the order ID or return to your order history.</p>
              <a class="btn btn--primary" href="orders.html">Back to My Orders</a>
            </div>`;
          return;
        }

        const concert = MOCK_CONCERTS.find(
          (item) => item.id === order.concertId,
        );
        const status = ORDER_STATUS_MAP[order.status];

        document.title = `${order.id} — Concertly`;
        document.getElementById("crumbId").textContent = order.id;
        document.getElementById("orderTitle").textContent = "Order details";
        document.getElementById("statusBadge").className =
          `badge ${status.cls}`;
        document.getElementById("statusBadge").textContent = status.label;

        const subtotal = orderSubtotal(order);
        const total = orderTotal(order);

        document.getElementById("detailGrid").innerHTML = `
    <div class="detail-col-main">
      <div class="panel">
        <div class="panel__head"><h3>Concert information</h3></div>
        <div class="concert-block">
          <img class="concert-block__poster" src="${concert.poster}" alt="${concert.title}" loading="lazy">
          <div class="concert-block__info">
            <h2>${concert.title}</h2>
            <div class="concert-artist">${concert.artist} · ${concert.category}</div>
            <div class="row">${icoCalendar} ${formatDateTime(`${concert.date}T${concert.time}`)}</div>
            <div class="row">${icoPin} ${concert.location}</div>
            <div class="concert-range">${concert.priceRange} · ${concert.status}</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h3>Tickets and seats (${order.tickets.length})</h3>
        </div>
        ${order.tickets
          .map(
            (t) => `
          <div class="line-ticket">
            <div class="line-ticket__left">
              <div class="line-ticket__icon">${icoTicket}</div>
              <div>
                <div class="line-ticket__seat">${t.seat}</div>
                <div class="line-ticket__type">${t.type}</div>
              </div>
            </div>
            <div class="line-ticket__price">${formatCurrency(t.price)}</div>
          </div>
        `,
          )
          .join("")}
      </div>
    </div>

    <div class="detail-col-side">
      <div class="panel">
        <div class="panel__head"><h3>Price breakdown</h3></div>
        <div class="price-line"><span>Subtotal (${order.tickets.length} tickets)</span><span class="value">${formatCurrency(subtotal)}</span></div>
        <div class="price-line"><span>Service fee</span><span class="value">${formatCurrency(order.fees)}</span></div>
        ${order.discount > 0 ? `<div class="price-line discount"><span>Discount</span><span class="value">−${formatCurrency(order.discount)}</span></div>` : ""}
        <div class="price-line total"><span>Total</span><span class="value">${formatCurrency(total)}</span></div>
      </div>

      <div class="panel">
        <div class="panel__head"><h3>Payment method</h3></div>
        <div class="pay-method">
          <div class="pay-method__icon">${icoCard}</div>
          <div>
            <div class="pay-method__name">${order.paymentMethod.name}</div>
            <div class="pay-method__sub">${order.paymentMethod.sub}</div>
            ${order.refundStatus === "processed" ? `<div class="pay-method__refund">Mock refund processed</div>` : ""}
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head"><h3>Order information</h3></div>
        <div class="summary-row"><span class="label">Placed on</span><span class="value">${formatDateTime(order.orderedAt)}</span></div>
        <div class="summary-row"><span class="label">Order ID</span><span class="value mono">${order.id}</span></div>
      </div>

      ${["pending", "paid"].includes(order.status) ? `<button class="btn btn--danger btn--block" id="cancelOrderButton" type="button">Cancel order</button>` : ""}
      <a class="btn btn--ghost btn--block" href="orders.html">Back to My Orders</a>
    </div>
  `;

        const cancelButton = document.getElementById("cancelOrderButton");
        cancelButton?.addEventListener("click", () => {
          if (cancelOrder(order.id)) render();
        });
      }

      render();
    </script>

    <div id="site-footer" data-root="../../"></div>
    <script src="../../js/footer.js"></script>
    <script src="../../js/navbar.js"></script>
    <script src="../../js/theme.js"></script>
  </body>
</html>

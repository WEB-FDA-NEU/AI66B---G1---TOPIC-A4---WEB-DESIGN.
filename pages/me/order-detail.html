<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Details — Concertly</title>
<link rel="stylesheet" href="../../css/me.css">
</head>
<body>
<div class="shell">

  <!-- ============ Shared site nav ============ -->
  <header class="site-nav">
    <div class="container site-nav__inner">
      <a href="/" class="brand">
        <span class="brand__mark"></span> Concertly
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/concerts">Concerts</a></li>
        <li><a href="/me/tickets">My Tickets</a></li>
        <li><a href="/me/orders" class="is-active">Orders</a></li>
      </ul>
      <div class="nav-user">
        <span class="nav-user__name">Lân Nguyễn</span>
        <div class="nav-user__avatar">L</div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head" style="padding-bottom:0;">
        <div>
          <div class="breadcrumb">
            <a href="/me/orders">Orders</a><span>/</span><span id="crumbId"></span>
          </div>
          <h1 id="orderTitle">Order Details</h1>
        </div>
        <span class="badge" id="statusBadge"></span>
      </div>

      <div style="height:24px;"></div>

      <div class="detail-grid" id="detailGrid"></div>
    </div>
  </main>
</div>

<script src="concertly-data.js"></script>
<script>
const icoCalendar = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const icoPin = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.6"/></svg>`;
const icoTicket = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a1.8 1.8 0 0 0 0 3.6V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.4a1.8 1.8 0 0 0 0-3.6V8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 6v12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/></svg>`;
const icoCard = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.6"/></svg>`;

/* ---- resolve order id from ?id= query param, default to most recent order ---- */
const params = new URLSearchParams(window.location.search);
const requestedId = params.get('id');
const order = getOrderById(requestedId) || MOCK_ORDERS[0];

function render(){
  const concert = CONCERTS[order.concertId];
  const status = ORDER_STATUS_MAP[order.status];

  document.title = `${order.id} — Concertly`;
  document.getElementById('crumbId').textContent = order.id;
  document.getElementById('orderTitle').innerHTML = `Order <span class="mono">${order.id}</span>`;
  document.getElementById('statusBadge').className = `badge ${status.cls}`;
  document.getElementById('statusBadge').textContent = status.label;

  const subtotal = orderSubtotal(order);
  const total = orderTotal(order);

  document.getElementById('detailGrid').innerHTML = `
    <div class="detail-col-main">
      <div class="panel">
        <div class="panel__head"><h3>Concert Information</h3></div>
        <div class="concert-block">
          <div class="concert-block__poster" style="background-image:${concert.gradient}"></div>
          <div class="concert-block__info">
            <h2>${concert.name}</h2>
            <div class="row">${icoCalendar} ${formatDateTime(concert.datetime)}</div>
            <div class="row">${icoPin} ${concert.venue}</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h3>Tickets / Seats (${order.tickets.length})</h3>
        </div>
        ${order.tickets.map(t => `
          <div class="line-ticket">
            <div class="line-ticket__left">
              <div class="line-ticket__icon">${icoTicket}</div>
              <div>
                <div class="line-ticket__seat">${t.seat}</div>
                <div class="line-ticket__type">${t.type}</div>
              </div>
            </div>
            <div class="line-ticket__price">${formatCurrency(t.price)}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="detail-col-side">
      <div class="panel">
        <div class="panel__head"><h3>Price Details</h3></div>
        <div class="price-line"><span>Subtotal (${order.tickets.length} tickets)</span><span class="value">${formatCurrency(subtotal)}</span></div>
        <div class="price-line"><span>Service Fee</span><span class="value">${formatCurrency(order.fees)}</span></div>
        ${order.discount > 0 ? `<div class="price-line discount"><span>Discount</span><span class="value">−${formatCurrency(order.discount)}</span></div>` : ''}
        <div class="price-line total"><span>Total</span><span class="value">${formatCurrency(total)}</span></div>
      </div>

      <div class="panel">
        <div class="panel__head"><h3>Payment Method</h3></div>
        <div class="pay-method">
          <div class="pay-method__icon">${icoCard}</div>
          <div>
            <div class="pay-method__name">${order.paymentMethod.name}</div>
            <div class="pay-method__sub">${order.paymentMethod.sub}</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head"><h3>Order Date</h3></div>
        <div class="summary-row"><span class="label">Placed at</span><span class="value">${formatDateTime(order.orderedAt)}</span></div>
        <div class="summary-row"><span class="label">Order ID</span><span class="value mono">${order.id}</span></div>
      </div>

      <a class="btn btn--ghost btn--block" href="me-orders.html">← Back to Orders</a>
    </div>
  `;
}

document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('is-open');
});

render();
</script>

<style>
  .detail-col-main, .detail-col-side{ display:flex; flex-direction:column; gap:18px; }
  #detailGrid{ display:grid; grid-template-columns: 1fr 340px; gap:22px; align-items:start; }
  @media (max-width: 860px){ #detailGrid{ grid-template-columns: 1fr; } }
</style>
<script src="../../js/me.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Tickets — Concertly</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/utilitites.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/me.css" />
    <script src="../../js/mock-data.js"></script>
    <script src="../../js/me.js"></script>
  </head>
  <body>
    <div class="shell">
      <!-- ============ Shared site nav ============ -->
      <header class="site-header">
        <div class="container">
          <a href="../../index.html" class="site-logo hover-glow">CONCERTLY</a>
          <div class="header-actions" data-home="../../index.html">
            <nav class="site-nav">
              <a href="../../index.html" class="hover-glow" data-nav>Home</a>
              <a href="../concerts/index.html" class="hover-glow" data-nav
                >Explore</a
              >
              <a href="../404.html" class="hover-glow" data-nav>Support</a>
              <span class="nav-indicator"></span>
            </nav>
            <form
              class="header-search"
              action="../concerts/index.html"
              method="get"
              role="search"
            >
              <input
                class="header-search-input"
                type="search"
                name="search"
                placeholder="Find your next live show..."
                aria-label="Search concerts"
              />
              <button
                class="header-search-button"
                type="submit"
                aria-label="Search"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="m20 20-4-4"></path>
                </svg>
              </button>
            </form>
            <div class="site-auth">
              <button
                class="avatar-button"
                type="button"
                aria-label="Account menu"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="8" r="3.5"></circle>
                  <path d="M5.5 20c.8-3.2 3.1-5 6.5-5s5.7 1.8 6.5 5"></path>
                </svg>
              </button>
              <div class="auth-menu" role="menu">
                <a href="../auth/login.html" data-auth-login role="menuitem"
                  >Sign in</a
                >
                <a href="../auth/register.html" role="menuitem">Sign up</a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="account-main">
        <div class="container">
          <div class="page-head">
            <div>
              <h1>My Tickets</h1>
              <p>All the tickets you've purchased on Concertly.</p>
            </div>
          </div>

          <div class="filter-tabs" id="filterTabs"></div>
          <div id="ticketGrid" class="ticket-grid"></div>
          <div id="emptyState" class="empty" style="display: none">
            <h3>No tickets in this status yet</h3>
            <p>Tickets you purchase will appear here.</p>
          </div>
        </div>
      </main>
    </div>

    <script>
      /* ---------- icons ---------- */
      const icoCalendar = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
      const icoPin = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.6"/></svg>`;
      const icoSeat = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M4 14h16l-1.2 6H5.2L4 14Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

      /* ---------- filter state ---------- */
      const FILTERS = [
        { key: "all", label: "All" },
        { key: "valid", label: "Valid" },
        { key: "pending", label: "Pending" },
        { key: "refunded", label: "Refunded" },
      ];
      let activeFilter = "all";

      function renderTabs() {
        const wrap = document.getElementById("filterTabs");
        wrap.innerHTML = FILTERS.map((f) => {
          const count =
            f.key === "all"
              ? MOCK_TICKETS.length
              : MOCK_TICKETS.filter((t) => t.status === f.key).length;
          return `<button class="filter-tab ${f.key === activeFilter ? "is-active" : ""}" data-key="${f.key}">
      ${f.label} <span class="count">${count}</span>
    </button>`;
        }).join("");
        wrap.querySelectorAll(".filter-tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeFilter = btn.dataset.key;
            renderTabs();
            renderTickets();
          });
        });
      }

      function renderTickets() {
        const grid = document.getElementById("ticketGrid");
        const empty = document.getElementById("emptyState");
        const list = MOCK_TICKETS.filter(
          (t) => activeFilter === "all" || t.status === activeFilter,
        );

        if (list.length === 0) {
          grid.style.display = "none";
          empty.style.display = "block";
          return;
        }
        grid.style.display = "grid";
        empty.style.display = "none";

        grid.innerHTML = list
          .map((ticket) => {
            const concert = MOCK_CONCERTS.find(
              (item) => item.id === ticket.concertId,
            );
            const status = TICKET_STATUS_MAP[ticket.status];
            return `
    <article class="ticket-card">
      <img class="ticket-card__poster" src="${concert.poster}" alt="${concert.title}" loading="lazy">
      <div class="ticket-card__main">
        <div class="ticket-card__top">
          <div class="ticket-card__title">${concert.title}</div>
          <span class="badge ${status.cls}">${status.label}</span>
        </div>
        <div class="ticket-card__meta">
          <div class="ticket-card__artist">${concert.artist} · ${concert.category}</div>
          <div>${icoCalendar} ${formatDateTime(`${concert.date}T${concert.time}`)}</div>
          <div>${icoPin} ${concert.location}</div>
          <div>${icoSeat} ${ticket.seat}</div>
          <div class="muted">Ticket ID: <span class="mono">${ticket.id}</span> · Order <a href="order-detail.html?id=${encodeURIComponent(ticket.orderId)}" class="mono">${ticket.orderId}</a></div>
        </div>
      </div>
      <div class="ticket-card__stub">
        <div>
          <div class="ticket-card__type">${ticket.type}</div>
          <div class="ticket-card__seat"><span>Seat</span>${seatCode(ticket.seat)}</div>
        </div>
        <div class="ticket-card__id mono">${ticket.id}</div>
        <div class="ticket-card__actions">
          <a class="text-link" href="ticket-detail.html?id=${encodeURIComponent(ticket.id)}">Open QR ticket</a>
          <a class="text-link" href="order-detail.html?id=${encodeURIComponent(ticket.orderId)}">View order</a>
        </div>
      </div>
    </article>`;
          })
          .join("");
      }

      renderTabs();
      renderTickets();
    </script>
    <div id="site-footer" data-root="../../"></div>
    <script src="../../js/footer.js"></script>
    <script src="../../js/navbar.js"></script>
    <script src="../../js/theme.js"></script>
  </body>
</html>

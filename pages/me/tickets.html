<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tickets — Concertly</title>
<<link rel="stylesheet" href="../../css/me.css">
</head>
<body>
<div class="shell">

  <!-- ============ Shared site nav ============ -->
  <header class="site-nav">
    <div class="container site-nav__inner">
      <a href="/" class="brand">
        <span class="brand__mark"></span> Concertly
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/concerts">Concerts</a></li>
        <li><a href="/me/tickets" class="is-active">My Tickets</a></li>
        <li><a href="/me/orders">Orders</a></li>
      </ul>
      <div class="nav-user">
        <span class="nav-user__name">Lân Nguyễn</span>
        <div class="nav-user__avatar">L</div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>My Tickets</h1>
          <p>All the tickets you've purchased on Concertly.</p>
        </div>
      </div>

      <div class="filter-tabs" id="filterTabs"></div>
      <div id="ticketGrid" class="ticket-grid"></div>
      <div id="emptyState" class="empty" style="display:none;">
        <h3>No tickets in this status yet</h3>
        <p>Tickets you purchase will appear here.</p>
      </div>
    </div>
  </main>
</div>

<script src="concertly-data.js"></script>
<script>
/* ---------- icons ---------- */
const icoCalendar = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const icoPin = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.6"/></svg>`;
const icoSeat = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M4 14h16l-1.2 6H5.2L4 14Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

/* ---------- filter state ---------- */
const FILTERS = [
  { key: 'all', label: 'All' },
  { key: 'valid', label: 'Valid' },
  { key: 'used', label: 'Used' },
  { key: 'cancelled', label: 'Cancelled' }
];
let activeFilter = 'all';

function renderTabs(){
  const wrap = document.getElementById('filterTabs');
  wrap.innerHTML = FILTERS.map(f => {
    const count = f.key === 'all'
      ? MOCK_TICKETS.length
      : MOCK_TICKETS.filter(t => t.status === f.key).length;
    return `<button class="filter-tab ${f.key === activeFilter ? 'is-active' : ''}" data-key="${f.key}">
      ${f.label} <span class="count">${count}</span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.key;
      renderTabs();
      renderTickets();
    });
  });
}

function barcode(){
  let bars = '';
  for (let i = 0; i < 22; i++){
    const h = 10 + Math.round(Math.random() * 16);
    bars += `<span style="height:${h}px"></span>`;
  }
  return `<div class="barcode">${bars}</div>`;
}

function renderTickets(){
  const grid = document.getElementById('ticketGrid');
  const empty = document.getElementById('emptyState');
  const list = MOCK_TICKETS.filter(t => activeFilter === 'all' || t.status === activeFilter);

  if (list.length === 0){
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = list.map(ticket => {
    const concert = CONCERTS[ticket.concertId];
    const status = TICKET_STATUS_MAP[ticket.status];
    return `
    <article class="ticket-card">
      <div class="ticket-card__poster" style="background-image:${concert.gradient}"></div>
      <div class="ticket-card__main">
        <div class="ticket-card__top">
          <div class="ticket-card__title">${concert.name}</div>
          <span class="badge ${status.cls}">${status.label}</span>
        </div>
        <div class="ticket-card__meta">
          <div>${icoCalendar} ${formatDateTime(concert.datetime)}</div>
          <div>${icoPin} ${concert.venue}</div>
          <div>${icoSeat} ${ticket.seat}</div>
          <div class="muted">Ticket ID: <span class="mono">${ticket.id}</span> · Order <a href="order-detail.html?id=${ticket.orderId}" class="mono" style="color:var(--brand)">${ticket.orderId}</a></div>
        </div>
      </div>
      <div class="ticket-card__stub">
        <div>
          <div class="ticket-card__type">${ticket.type}</div>
          <div class="ticket-card__seat"><span>Seat</span>${seatCode(ticket.seat)}</div>
        </div>
        ${barcode()}
      </div>
    </article>`;
  }).join('');
}

/* ---------- mobile nav toggle ---------- */
document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('is-open');
});

renderTabs();
renderTickets();
</script>
<script src="../../js/me.js"></script>
</body>
</html>

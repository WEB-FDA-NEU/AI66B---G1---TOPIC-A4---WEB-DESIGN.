<!doctype html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ticket Detail - Concertly</title>
    <style>
        body { background-color: #0b0b0b; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; padding: 20px; }
        .box { background: #161616; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid #222; }
        h2 { color: #ff3399; text-align: center; margin-bottom: 20px; }
        .ticket-card { background: #202020; border-radius: 10px; padding: 20px; border-left: 5px solid #ff3399; }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ticket-status { background: rgba(0, 255, 128, 0.15); color: #00ff80; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .ticket-info p { font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .ticket-info span { color: #fff; font-weight: 500; }
        .poster-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; }
        .qr-section { text-align: center; margin-top: 20px; background: #fff; padding: 15px; border-radius: 8px; color: #000; }
        .qr-placeholder { width: 100px; height: 100px; margin: 0 auto; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Digital Ticket Detail</h2>
        <div class="ticket-card" id="ticket-container">
            <!-- Dữ liệu sẽ được điền tự động bằng JavaScript từ mock-data.js -->
            <p style="text-align: center; color: #888;">Loading ticket details...</p>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <a href="../../index.html" style="color: #ff3399; text-decoration: none; font-size: 14px;">← Explore other concerts</a>
        </div>
    </div>

    <!-- Nhúng file mock-data.js của nhóm vào -->
    <script src="../../js/mock-data.js"></script>
    <script>
        // Lấy id từ URL (ví dụ: ticket-detail.html?id=c1 thì lấy ra c1)
        const urlParams = new URLSearchParams(window.location.search);
        const concertId = urlParams.get('id') || 'c1'; // Mặc định lấy c1 nếu không truyền id

        // Tìm concert trong mảng MOCK_CONCERTS từ file mock-data.js
        const concert = MOCK_CONCERTS.find(c => c.id === concertId) || MOCK_CONCERTS[0];

        const ticketHolderName = localStorage.getItem('loggedInUser') || 'Guest User';

        // Hiển thị thông tin lên giao diện vé
        const container = document.getElementById('ticket-container');
        container.innerHTML = `
            <img src="${concert.poster}" alt="${concert.title}" class="poster-img">
            <div class="ticket-header">
                <span style="font-weight: bold; font-size: 16px;">${concert.title}</span>
                <span class="ticket-status">Valid</span>
            </div>
            <div class="ticket-info">
                <p>Artist: <span>${concert.artist}</span></p>
                <p>Date & Time: <span>${concert.date} - ${concert.time}</span></p>
                <p>Venue: <span>${concert.location}</span></p>
                <p>Ticket Type: <span>${concert.tickets[0].type} (${concert.tickets[0].price})</span></p>
                <p>Ticket Holder: <span>${ticketHolderName}</span></p>
                <p>Ticket ID: <span>#CNCT-${Math.floor(100000 + Math.random() * 900000)}</span></p>
            </div>
            <div class="qr-section">
                <div class="qr-placeholder">[ MOCK QR ]</div>
                <p style="color: #666; font-size: 11px; margin-top: 6px;">Scan at the entrance gate</p>
            </div>
        `;
    </script>
</html>

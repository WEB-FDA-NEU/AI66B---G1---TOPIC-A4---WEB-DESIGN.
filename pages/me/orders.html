<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="../../js/theme-init.js"></script>
    <title>My Orders — Concertly</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/utilitites.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/me.css" />
    <script src="../../js/api.js"></script>
    <script src="../../js/me.js"></script>
  </head>
  <body>
    <div class="shell">
      <!-- ============ Shared site nav ============ -->
      <header class="site-header">
        <div class="container">
          <a href="../../index.html" class="site-logo hover-glow">CONCERTLY</a>
          <div class="header-actions" data-home="../../index.html">
            <nav class="site-nav">
              <a href="../../index.html" class="hover-glow" data-nav>Home</a>
              <a href="../concerts/index.html" class="hover-glow" data-nav
                >Explore</a
              >
              <a href="../404.html" class="hover-glow" data-nav>Support</a>
              <span class="nav-indicator"></span>
            </nav>
            <form
              class="header-search"
              action="../concerts/index.html"
              method="get"
              role="search"
            >
              <input
                class="header-search-input"
                type="search"
                name="search"
                placeholder="Find your next live show..."
                aria-label="Search concerts"
              />
              <button
                class="header-search-button"
                type="submit"
                aria-label="Search"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="m20 20-4-4"></path>
                </svg>
              </button>
            </form>
            <div class="site-auth">
              <button
                class="avatar-button"
                type="button"
                aria-label="Account menu"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="8" r="3.5"></circle>
                  <path d="M5.5 20c.8-3.2 3.1-5 6.5-5s5.7 1.8 6.5 5"></path>
                </svg>
              </button>
              <div class="auth-menu" role="menu">
                <a href="../auth/login.html" data-auth-login role="menuitem"
                  >Sign in</a
                >
                <a href="../auth/register.html" role="menuitem">Sign up</a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="account-main">
        <div class="container">
          <div class="page-head">
            <div>
              <h1>My Orders</h1>
              <p>Your complete Concertly order history.</p>
            </div>
          </div>

          <div class="filter-tabs" id="filterTabs"></div>

          <table class="order-table" id="orderTable">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Concert</th>
                <th>Order date</th>
                <th>Total</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
          </table>

          <div class="order-cards" id="orderCards"></div>

          <div id="loadState"></div>

          <div id="emptyState" class="empty" style="display: none">
            <h3>No orders in this status</h3>
            <p>Your Concertly orders will appear here.</p>
          </div>
        </div>
      </main>
    </div>

    <script>
      const FILTERS = [
        { key: "all", label: "All" },
        { key: "pending", label: "Pending" },
        { key: "paid", label: "Paid" },
        { key: "refunded", label: "Refunded" },
        { key: "cancelled", label: "Cancelled" },
        { key: "failed", label: "Failed" },
      ];
      let activeFilter = "all";
      let orders = [];

      function renderTabs() {
        const wrap = document.getElementById("filterTabs");
        wrap.innerHTML = FILTERS.map((f) => {
          const count =
            f.key === "all"
              ? orders.length
              : orders.filter((o) => orderDisplayStatus(o) === f.key).length;
          return `<button class="filter-tab ${f.key === activeFilter ? "is-active" : ""}" data-key="${f.key}">
      ${f.label} <span class="count">${count}</span>
    </button>`;
        }).join("");
        wrap.querySelectorAll(".filter-tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeFilter = btn.dataset.key;
            renderTabs();
            renderOrders();
          });
        });
      }

      function showOnly(element) {
        const ids = ["orderTable", "orderCards", "emptyState", "loadState"];
        ids.forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.style.display = id === element ? (id === "emptyState" ? "block" : "") : "none";
        });
      }

      function renderOrders() {
        const list = orders.filter(
          (o) => activeFilter === "all" || orderDisplayStatus(o) === activeFilter,
        ); // the API already returns newest first

        if (list.length === 0) {
          showOnly("emptyState");
          return;
        }
        showOnly("orderTable");
        document.getElementById("orderCards").style.display = "";

        const detailUrl = (o) => `order-detail.html?id=${encodeURIComponent(o.id)}`;
        const meta = (o) =>
          `${escapeHtml(o.artist)} · ${formatDateTime(o.starts_at)}<br>${escapeHtml(concertLocation(o))}`;

        document.getElementById("orderTableBody").innerHTML = list
          .map(
            (o) => `
    <tr>
      <td class="order-code mono"><a href="${detailUrl(o)}">${orderCode(o)}</a></td>
      <td><div class="order-concert">${escapeHtml(o.concert_title)}</div><div class="order-concert-meta">${meta(o)}</div></td>
      <td class="order-date">${formatDateShort(o.created_at)}</td>
      <td class="order-total mono">${formatCurrency(o.total_amount)}</td>
      <td>${statusBadge(ORDER_STATUS_MAP, orderDisplayStatus(o))}</td>
      <td class="chev"><a href="${detailUrl(o)}" aria-label="View order ${orderCode(o)}">View</a></td>
    </tr>`,
          )
          .join("");

        document.getElementById("orderCards").innerHTML = list
          .map(
            (o) => `
    <a class="order-card" href="${detailUrl(o)}">
      <div class="order-card__top">
        <span class="order-code mono">${orderCode(o)}</span>
        ${statusBadge(ORDER_STATUS_MAP, orderDisplayStatus(o))}
      </div>
      <div class="order-concert">${escapeHtml(o.concert_title)}</div>
      <div class="order-concert-meta">${meta(o)}</div>
      <div class="order-card__row"><span>Order date</span><span>${formatDateShort(o.created_at)}</span></div>
      <div class="order-card__row"><span>Total</span><span class="order-card__total mono">${formatCurrency(o.total_amount)}</span></div>
    </a>`,
          )
          .join("");
      }

      async function load() {
        const state = document.getElementById("loadState");
        state.innerHTML = loadingHTML("Loading your orders…");
        showOnly("loadState");
        try {
          orders = await ConcertlyAPI.myOrders();
        } catch (error) {
          state.innerHTML = errorHTML(error);
          return;
        }
        renderTabs();
        renderOrders();
      }

      load();
    </script>
    <div id="site-footer" data-root="../../"></div>
    <script src="../../js/footer.js"></script>
    <script src="../../js/navbar.js"></script>
    <script src="../../js/theme.js"></script>
  </body>
</html>

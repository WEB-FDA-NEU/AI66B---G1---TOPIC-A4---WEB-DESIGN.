<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đơn hàng của tôi — Concertly</title>
<link rel="stylesheet" href="concertly-styles.css">
</head>
<body>
<div class="shell">

  <!-- ============ Shared site nav ============ -->
  <header class="site-nav">
    <div class="container site-nav__inner">
      <a href="/" class="brand">
        <span class="brand__mark"></span> Concertly
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Mở menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Trang chủ</a></li>
        <li><a href="/concerts">Concert</a></li>
        <li><a href="/me/tickets">Vé của tôi</a></li>
        <li><a href="/me/orders" class="is-active">Đơn hàng</a></li>
      </ul>
      <div class="nav-user">
        <span class="nav-user__name">Lân Nguyễn</span>
        <div class="nav-user__avatar">L</div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Đơn hàng của tôi</h1>
          <p>Lịch sử tất cả đơn hàng bạn đã đặt trên Concertly.</p>
        </div>
      </div>

      <div class="filter-tabs" id="filterTabs"></div>

      <table class="order-table" id="orderTable">
        <thead>
          <tr>
            <th>Mã đơn hàng</th>
            <th>Concert</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="orderTableBody"></tbody>
      </table>

      <div class="order-cards" id="orderCards"></div>

      <div id="emptyState" class="empty" style="display:none;">
        <h3>Chưa có đơn hàng nào ở trạng thái này</h3>
        <p>Đơn hàng bạn đặt sẽ hiển thị tại đây.</p>
      </div>
    </div>
  </main>
</div>

<script src="concertly-data.js"></script>
<script>
const FILTERS = [
  { key: 'all', label: 'Tất cả' },
  { key: 'pending', label: 'Chờ thanh toán' },
  { key: 'paid', label: 'Đã thanh toán' },
  { key: 'refunded', label: 'Đã hoàn tiền' },
  { key: 'cancelled', label: 'Đã hủy' }
];
let activeFilter = 'all';

function renderTabs(){
  const wrap = document.getElementById('filterTabs');
  wrap.innerHTML = FILTERS.map(f => {
    const count = f.key === 'all'
      ? MOCK_ORDERS.length
      : MOCK_ORDERS.filter(o => o.status === f.key).length;
    return `<button class="filter-tab ${f.key === activeFilter ? 'is-active' : ''}" data-key="${f.key}">
      ${f.label} <span class="count">${count}</span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.key;
      renderTabs();
      renderOrders();
    });
  });
}

function goToOrder(id){
  window.location.href = `order-detail.html?id=${id}`;
}

function renderOrders(){
  const tbody = document.getElementById('orderTableBody');
  const cardsWrap = document.getElementById('orderCards');
  const table = document.getElementById('orderTable');
  const empty = document.getElementById('emptyState');

  const list = MOCK_ORDERS
    .filter(o => activeFilter === 'all' || o.status === activeFilter)
    .slice()
    .sort((a, b) => new Date(b.orderedAt) - new Date(a.orderedAt));

  if (list.length === 0){
    table.style.display = 'none';
    cardsWrap.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  table.style.display = '';
  cardsWrap.style.display = '';
  empty.style.display = 'none';

  tbody.innerHTML = list.map(order => {
    const concert = CONCERTS[order.concertId];
    const status = ORDER_STATUS_MAP[order.status];
    return `
    <tr onclick="goToOrder('${order.id}')">
      <td class="order-code mono">${order.id}</td>
      <td class="order-concert">${concert.name}</td>
      <td class="order-date">${formatDateShort(order.orderedAt)}</td>
      <td class="order-total mono">${formatCurrency(orderTotal(order))}</td>
      <td><span class="badge ${status.cls}">${status.label}</span></td>
      <td class="chev">›</td>
    </tr>`;
  }).join('');

  cardsWrap.innerHTML = list.map(order => {
    const concert = CONCERTS[order.concertId];
    const status = ORDER_STATUS_MAP[order.status];
    return `
    <div class="order-card" onclick="goToOrder('${order.id}')">
      <div class="order-card__top">
        <span class="order-code mono">${order.id}</span>
        <span class="badge ${status.cls}">${status.label}</span>
      </div>
      <div class="order-concert">${concert.name}</div>
      <div class="order-card__row"><span>Ngày đặt</span><span>${formatDateShort(order.orderedAt)}</span></div>
      <div class="order-card__row"><span>Tổng tiền</span><span class="mono" style="font-weight:600;color:var(--ink)">${formatCurrency(orderTotal(order))}</span></div>
    </div>`;
  }).join('');
}

document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('is-open');
});

renderTabs();
renderOrders();
</script>
</body>
</html>

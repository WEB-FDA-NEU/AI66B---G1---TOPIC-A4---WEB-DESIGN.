<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Concerts | Concertly</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/utilitites.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <style>
      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-family);
        margin: 0;
      }
      .page-header {
        padding: var(--space-xl) 0 var(--space-lg);
        border-bottom: 1px solid var(--color-border);
        margin-bottom: var(--space-xl);
      }
      .page-title {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
        margin-bottom: var(--space-xs);
      }
      .page-subtitle {
        color: var(--color-text-secondary);
        font-size: var(--font-md);
        margin: 0;
      }
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-md);
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-xl);
      }
      .filter-tools {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-left: auto;
      }
      .result-count {
        color: var(--color-text-muted);
        font-size: var(--font-xs);
        white-space: nowrap;
      }
      .sort-select,
      .clear-filters {
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-surface);
        color: var(--color-text-secondary);
        font: inherit;
        font-size: var(--font-xs);
      }
      .clear-filters {
        cursor: pointer;
      }
      .clear-filters:hover,
      .sort-select:focus {
        border-color: var(--color-primary);
        color: var(--color-text);
        outline: none;
      }
      .search-box {
        flex: 1;
        min-width: 260px;
        max-width: 400px;
        position: relative;
      }
      .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--color-text-muted);
        pointer-events: none;
      }
      .search-input {
        width: 100%;
        padding: 10px 16px 10px 40px;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        color: var(--color-text);
        font-size: var(--font-sm);
        outline: none;
        transition: border-color 0.2s ease;
      }
      .search-input:focus {
        border-color: var(--color-primary);
      }
      .category-pills {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-xs);
      }
      .pill-btn {
        padding: 6px 14px;
        border-radius: 999px;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        color: var(--color-text-secondary);
        font-size: var(--font-xs);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .pill-btn:hover,
      .pill-btn.active {
        background-color: var(--color-primary);
        border-color: var(--color-primary);
        color: #fff;
      }
      .concert-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: var(--space-lg);
        margin-bottom: var(--space-2xl);
      }
      .card {
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.25s ease,
          border-color 0.25s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: var(--color-primary);
      }
      .concert-card {
        cursor: pointer;
      }
      .concert-card:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 3px;
      }
      .card-img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        display: block;
      }
      .card-body {
        padding: var(--space-md);
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .card-badge {
        align-self: flex-start;
        font-size: var(--font-xs);
        font-weight: 600;
        color: var(--color-primary);
        margin-bottom: var(--space-xs);
      }
      .card-title {
        font-size: var(--font-md);
        font-weight: 700;
        margin-bottom: 4px;
        color: var(--color-text);
        text-decoration: none;
      }
      .card-meta {
        font-size: var(--font-sm);
        color: var(--color-text-secondary);
        margin-bottom: var(--space-sm);
      }
      .card-footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: var(--space-sm);
        border-top: 1px solid var(--color-border);
      }
      .card-price {
        margin-left: auto;
        font-weight: 700;
        color: var(--color-text);
        font-size: var(--font-sm);
      }
      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: var(--space-2xl) 0;
        color: var(--color-text-secondary);
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <header class="site-header">
      <div class="container">
        <a href="../../index.html" class="site-logo hover-glow">CONCERTLY</a>
        <div class="header-actions" data-home="../../index.html">
          <nav class="site-nav">
            <a href="../../index.html" class="hover-glow" data-nav>Home</a>
            <a href="index.html" class="active hover-glow" data-nav>Explore</a>
            <a href="../404.html" class="hover-glow" data-nav>Support</a>
            <span class="nav-indicator"></span>
          </nav>
          <div class="site-auth">
            <button class="avatar-button" type="button" aria-label="Account menu">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5.5 20c.8-3.2 3.1-5 6.5-5s5.7 1.8 6.5 5"></path>
              </svg>
            </button>
            <div class="auth-menu" role="menu">
              <a href="../auth/login.html" data-auth-login role="menuitem">Sign in</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Header -->
    <div class="page-header">
      <div class="container">
        <h1 class="page-title">Explore Tours & Concerts</h1>
        <p class="page-subtitle">
          Browse all upcoming world tours, stadium shows, and exclusive
          showcases
        </p>
      </div>
    </div>

    <main class="container">
      <!-- Filter & Search Controls -->
      <section class="filter-bar">
        <div class="category-pills" id="category-filters">
          <button class="pill-btn active" data-category="all">
            All Genres
          </button>
          <button class="pill-btn" data-category="Pop">Pop</button>
          <button class="pill-btn" data-category="R&B">R&B</button>
          <button class="pill-btn" data-category="Hip-Hop">Hip-Hop</button>
          <button class="pill-btn" data-category="K-Pop">K-Pop</button>
        </div>
        <div class="search-box">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search artist, tour or city..."
          />
        </div>
        <div class="filter-tools">
          <span class="result-count" id="result-count"></span>
          <select id="status-select" class="sort-select" aria-label="Filter by ticket status">
            <option value="all">All concerts</option>
            <option value="popular">Most Popular</option>
            <option value="selling-fast">Selling Fast</option>
            <option value="limited">Limited Availability</option>
          </select>
          <select id="sort-select" class="sort-select" aria-label="Sort concerts">
            <option value="date">Soonest date</option>
            <option value="price-low">Price: low to high</option>
            <option value="price-high">Price: high to low</option>
          </select>
          <button type="button" class="clear-filters" id="clear-filters">Clear</button>
        </div>
      </section>

      <!-- Concert Cards Grid -->
      <section class="concert-grid" id="explore-grid">
        <!-- Injected dynamically via JS -->
      </section>
    </main>

    <!-- Scripts -->
    <script src="../../js/mock-data.js"></script>
    <script src="../../js/navbar.js"></script>
    <script>
      let activeCategory = "all";
      const initialSearch = new URLSearchParams(window.location.search).get("search") || "";
      let searchQuery = initialSearch.trim();
      let activeView = "all";
      let sortMode = "date";

      const grid = document.getElementById("explore-grid");
      const searchInput = document.getElementById("search-input");
      const filterButtons = document.querySelectorAll(
        "#category-filters .pill-btn",
      );
      const sortSelect = document.getElementById("sort-select");
      const statusSelect = document.getElementById("status-select");
      const clearFiltersButton = document.getElementById("clear-filters");
      const resultCount = document.getElementById("result-count");

      if (searchInput) searchInput.value = searchQuery;

      function renderConcerts() {
        if (typeof MOCK_CONCERTS === "undefined" || !grid) return;

        const filtered = MOCK_CONCERTS.filter((item) => {
          const matchesCategory =
            activeCategory === "all" ||
            item.category.toLowerCase() === activeCategory.toLowerCase();
          const term = searchQuery.toLowerCase();
          const matchesSearch =
            item.artist.toLowerCase().includes(term) ||
            item.title.toLowerCase().includes(term) ||
            item.location.toLowerCase().includes(term);
          const status = (item.status || "").toLowerCase();
          const matchesView =
            activeView === "all" ||
            (activeView === "popular" && status.includes("popular")) ||
            (activeView === "selling-fast" && status.includes("selling")) ||
            (activeView === "limited" && status.includes("limited availability"));
          return matchesCategory && matchesSearch && matchesView;
        });

        filtered.sort((a, b) => {
          if (sortMode === "price-low" || sortMode === "price-high") {
            const priceA = Number.parseInt(a.priceRange.replace(/[^0-9]/g, ""), 10);
            const priceB = Number.parseInt(b.priceRange.replace(/[^0-9]/g, ""), 10);
            return sortMode === "price-low" ? priceA - priceB : priceB - priceA;
          }

          return new Date(a.date) - new Date(b.date);
        });

        resultCount.textContent = `${filtered.length} ${filtered.length === 1 ? "concert" : "concerts"}`;

        if (filtered.length === 0) {
          grid.innerHTML = `
          <div class="empty-state">
            <h3 style="font-size: var(--font-lg); margin-bottom: 8px;">No concerts found</h3>
            <p>Try searching with another keyword or selecting another genre filter.</p>
          </div>
        `;
          return;
        }

        grid.innerHTML = filtered
          .map((c) => {
            const s = (c.status || "").toLowerCase();
            const statusClass = s.includes("selling")
              ? "selling-fast"
              : s.includes("popular")
                ? "hot"
                : s.includes("limited availability")
                  ? "high-demand"
                  : "default";
            const statusTitle = s.includes("selling")
              ? "Vé đang bán nhanh — sắp hết"
              : s.includes("popular")
                ? "Most popular concert"
                : s.includes("limited availability")
                  ? "Limited tickets remaining"
                  : "Còn vé";

            return `
        <article class="card concert-card" data-href="detail.html?id=${c.id}" tabindex="0" role="link">
          <div class="card-media">
            <img src="${c.poster}" alt="${c.artist}" class="card-img" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-labels">
              <span class="card-badge">${c.category}</span>
              <span class="status-tag ${statusClass}" title="${statusTitle}">${c.status}</span>
            </div>
            <a href="detail.html?id=${c.id}" class="card-title">${c.title}</a>
            <div class="card-meta">${c.artist} | ${c.date}</div>
            <div class="card-footer">
              <span class="card-price">${c.priceRange}</span>
            </div>
          </div>
        </article>
      `;
          })
          .join("");

        grid.querySelectorAll(".concert-card").forEach((card) => {
          card.addEventListener("click", (event) => {
            if (event.target.closest("a, button")) return;
            window.location.href = card.dataset.href;
          });

          card.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            window.location.href = card.dataset.href;
          });
        });

      }

      // Category button click listener
      filterButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activeCategory = btn.getAttribute("data-category");
          renderConcerts();
        });
      });

      statusSelect.addEventListener("change", () => {
        activeView = statusSelect.value;
        renderConcerts();
      });

      // Search input listener
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          searchQuery = e.target.value.trim();
          renderConcerts();
        });
      }

      sortSelect.addEventListener("change", () => {
        sortMode = sortSelect.value;
        renderConcerts();
      });

      clearFiltersButton.addEventListener("click", () => {
        activeCategory = "all";
        searchQuery = "";
        activeView = "all";
        sortMode = "date";
        searchInput.value = "";
        statusSelect.value = "all";
        sortSelect.value = "date";
        filterButtons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.category === "all");
        });
        renderConcerts();
      });

      // Initial render
      renderConcerts();
    </script>
    <div id="site-footer" data-root="../../"></div>
    <script src="../../js/footer.js"></script>
  </body>
</html>

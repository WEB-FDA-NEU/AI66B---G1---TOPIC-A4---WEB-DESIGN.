<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Concerts | Concertly</title>
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/utilitites.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <style>
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-family);
      margin: 0;
    }
    .page-header {
      padding: var(--space-xl) 0 var(--space-lg);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-xl);
    }
    .page-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      margin-bottom: var(--space-xs);
    }
    .page-subtitle {
      color: var(--color-text-secondary);
      font-size: var(--font-md);
      margin: 0;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xl);
    }
    .search-box {
      flex: 1;
      min-width: 260px;
      max-width: 400px;
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--color-text-muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-size: var(--font-sm);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--color-primary);
    }
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
    }
    .pill-btn {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      font-size: var(--font-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pill-btn:hover, .pill-btn.active {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .concert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-lg);
      margin-bottom: var(--space-2xl);
    }
    .card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--color-primary);
    }
    .card-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-badge {
      align-self: flex-start;
      font-size: var(--font-xs);
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-xs);
    }
    .card-title {
      font-size: var(--font-md);
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--color-text);
      text-decoration: none;
    }
    .card-meta {
      font-size: var(--font-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-sm);
    }
    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: var(--space-sm);
      border-top: 1px solid var(--color-border);
    }
    .card-price {
      font-weight: 700;
      color: var(--color-text);
      font-size: var(--font-sm);
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--space-2xl) 0;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="site-header">
    <div class="container">
      <a href="../../index.html" class="site-logo">CONCERTLY</a>
      <nav class="site-nav">
        <a href="../../index.html">Home</a>
        <a href="index.html" class="active">Explore</a>
        <a href="../404.html">Support</a>
      </nav>
    </div>
  </header>

  <!-- Page Header -->
  <div class="page-header">
    <div class="container">
      <h1 class="page-title">Explore Tours & Concerts</h1>
      <p class="page-subtitle">Browse all upcoming world tours, stadium shows, and exclusive showcases</p>
    </div>
  </div>

  <main class="container">
    <!-- Filter & Search Controls -->
    <section class="filter-bar">
      <div class="category-pills" id="category-filters">
        <button class="pill-btn active" data-category="all">All Genres</button>
        <button class="pill-btn" data-category="Pop">Pop</button>
        <button class="pill-btn" data-category="R&B">R&B</button>
        <button class="pill-btn" data-category="Hip-Hop">Hip-Hop</button>
        <button class="pill-btn" data-category="K-Pop">K-Pop</button>
      </div>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search artist, tour or city...">
      </div>
    </section>

    <!-- Concert Cards Grid -->
    <section class="concert-grid" id="explore-grid">
      <!-- Injected dynamically via JS -->
    </section>
  </main>

  <!-- Scripts -->
  <script src="../../js/mock-data.js"></script>
  <script src="../../js/navbar.js"></script>
  <script>
    let activeCategory = 'all';
    let searchQuery = '';

    const grid = document.getElementById('explore-grid');
    const searchInput = document.getElementById('search-input');
    const filterButtons = document.querySelectorAll('#category-filters .pill-btn');

    function renderConcerts() {
      if (typeof MOCK_CONCERTS === 'undefined' || !grid) return;

      const filtered = MOCK_CONCERTS.filter(item => {
        const matchesCategory = (activeCategory === 'all') || (item.category.toLowerCase() === activeCategory.toLowerCase());
        const term = searchQuery.toLowerCase();
        const matchesSearch = item.artist.toLowerCase().includes(term) || 
                              item.title.toLowerCase().includes(term) || 
                              item.location.toLowerCase().includes(term);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3 style="font-size: var(--font-lg); margin-bottom: 8px;">No concerts found</h3>
            <p>Try searching with another keyword or selecting another genre filter.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(c => {
        const s = (c.status || '').toLowerCase();
        const statusClass = s.includes('selling') ? 'selling-fast'
          : s.includes('hot') ? 'hot'
          : s.includes('high demand') ? 'high-demand'
          : 'default';

        return `
        <article class="card">
          <div class="card-media">
            <img src="${c.poster}" alt="${c.artist}" class="card-img" loading="lazy">
            <span class="status-tag ${statusClass}">${c.status}</span>
          </div>
          <div class="card-body">
            <span class="card-badge">${c.category}</span>
            <a href="detail.html?id=${c.id}" class="card-title">${c.title}</a>
            <div class="card-meta">${c.artist} | ${c.date}</div>
            <div class="card-footer">
              <span class="card-price">${c.priceRange}</span>
              <a href="detail.html?id=${c.id}" class="btn btn-primary" style="padding: 6px 14px; font-size: var(--font-xs);">Book Now</a>
            </div>
          </div>
        </article>
      `;
      }).join('');
    }

    // Category button click listener
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.getAttribute('data-category');
        renderConcerts();
      });
    });

    // Search input listener
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderConcerts();
      });
    }

    // Initial render
    renderConcerts();
  </script>
</body>
</html>

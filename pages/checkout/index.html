<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="../../js/theme-init.js"></script>
    <title>Checkout | Concertly</title>

    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/checkout.css" />
    <link rel="stylesheet" href="../../css/seats.css" />
    <script src="../../js/components.js"></script>
    <link rel="stylesheet" href="../../css/responsive.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
  </head>

  <body>
    <div id="site-navbar" data-root="../../"></div>

    <main class="checkout-page">
      <div class="container checkout-container">
        <h1>Checkout</h1>

        <form id="checkout-form" class="checkout-form">
        <div class="checkout-layout">
          <!-- LEFT -->

          <section class="checkout-card concert-summary">
            <div id="concert-banner"></div>

            <div id="concert-info"></div>
          </section>

          <section class="checkout-card">
            <h2>Buyer Information</h2>

            <label for="buyer-name">Full name</label>
            <input id="buyer-name" name="full_name" type="text" autocomplete="name" minlength="2" maxlength="150" required />

            <label for="buyer-email">Email</label>
            <input id="buyer-email" name="email" type="email" autocomplete="email" maxlength="255" required />

            <label for="buyer-phone">Phone number</label>
            <input id="buyer-phone" name="phone" type="tel" autocomplete="tel" maxlength="30" required aria-describedby="phone-hint" />
            <p id="phone-hint">8–15 digits; spaces, brackets and a leading + are allowed.</p>
          </section>
        </div>

        <!-- RIGHT -->

        <section class="checkout-card payment-card">
          <h2>Payment</h2>

          <p id="mock-checkout-notice" class="checkout-notice" hidden>Demo checkout only. No real seats or admission tickets will be issued.</p>
          <p id="checkout-timer" class="checkout-timer" role="timer">Checking reservation…</p>
          <p id="checkout-feedback" role="alert" hidden></p>
          <button id="retry-reservation" type="button" class="btn btn-secondary" hidden>Retry reservation</button>
          <div id="payment-summary"></div>

          <label for="payment-method">Payment method (simulated)</label>
          <select id="payment-method" name="payment_method" required>
            <option value="">Select a payment method</option>
            <option value="card">Credit Card</option>

            <option value="ewallet">PayPal</option>

            <option value="bank_transfer">Bank Transfer</option>
          </select>

          <button id="confirm-payment" type="submit" class="btn btn-primary" disabled>
            Confirm Payment
          </button>
        </section>
        </form>
        <section id="checkout-result" class="checkout-card" tabindex="-1" hidden></section>
      </div>
    </main>

    <div id="site-footer" data-root="../../"></div>

    <script src="../../js/navbar.js"></script>

    <script src="../../js/footer.js"></script>

    <script src="../../js/purchases.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/checkout.js"></script>
  <script src="../../js/theme.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout | Concertly</title>

    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/utilitites.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/checkout.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <a href="../../index.html" class="site-logo hover-glow">CONCERTLY</a>
        <div class="header-actions" data-home="../../index.html">
          <nav class="site-nav">
            <a href="../../index.html" class="hover-glow" data-nav>Home</a>
            <a href="../concerts/index.html" class="hover-glow" data-nav
              >Explore</a
            >
            <a href="../404.html" class="hover-glow" data-nav>Support</a>
            <span class="nav-indicator"></span>
          </nav>
          <form
            class="header-search"
            action="../concerts/index.html"
            method="get"
            role="search"
          >
            <input
              class="header-search-input"
              type="search"
              name="search"
              placeholder="Find your next live show..."
              aria-label="Search concerts"
            />
            <button
              class="header-search-button"
              type="submit"
              aria-label="Search"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-4-4"></path>
              </svg>
            </button>
          </form>
          <div class="site-auth">
            <button
              class="avatar-button"
              type="button"
              aria-label="Account menu"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5.5 20c.8-3.2 3.1-5 6.5-5s5.7 1.8 6.5 5"></path>
              </svg>
            </button>
            <div class="auth-menu" role="menu">
              <a href="../auth/login.html" data-auth-login role="menuitem"
                >Sign in</a
              >
              <a href="../auth/register.html" role="menuitem">Sign up</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="checkout-page">
      <div class="container checkout-container">
        <h1>Checkout</h1>

        <div class="checkout-layout">
          <!-- LEFT -->

          <section class="checkout-card concert-summary">
            <div id="concert-banner"></div>

            <div id="concert-info"></div>
          </section>

          <section class="checkout-card">
            <h2>Buyer Information</h2>

            <input
              id="buyer-name"
              type="text"
              placeholder="Full Name"
              autocomplete="name"
              required
            />

            <input type="email" placeholder="Email" />

            <input type="tel" placeholder="Phone Number" />
          </section>
        </div>

        <!-- RIGHT -->

        <section class="checkout-card payment-card">
          <h2>Payment</h2>

          <div id="payment-summary"></div>

          <select>
            <option>Credit Card</option>

            <option>PayPal</option>

            <option>Bank Transfer</option>
          </select>

          <button id="confirm-payment" class="btn btn-primary">
            Confirm Payment
          </button>
        </section>
      </div>
    </main>

    <div id="site-footer" data-root="../../"></div>

    <script src="../../js/navbar.js"></script>

    <script src="../../js/footer.js"></script>
    <script src="../../js/theme.js"></script>

    <script src="../../js/mock-data.js"></script>
    <script src="../../js/purchases.js"></script>
    <script src="../../js/checkout.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../js/theme-init.js"></script>
    <title>Register - Concertly</title>
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/auth-background.css" />
    <style>
      body {
        background-color: #0b0b0b;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: sans-serif;
      }
      .box {
        background: #161616;
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        border: 1px solid #222;
      }
      h2 {
        color: #ff3399;
        text-align: center;
        margin-bottom: 24px;
      }
      .input-group {
        margin-bottom: 16px;
      }
      .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #ccc;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #222;
        color: #fff;
        outline: none;
        box-sizing: border-box;
      }
      .input-group input:focus {
        border-color: #ff3399;
      }
      .error-msg {
        background: rgba(255, 51, 153, 0.1);
        border: 1px solid #ff3399;
        color: #ff3399;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 12px;
        display: none;
      }
      #password-strength {
        font-size: 12px;
        margin-top: 6px;
        font-weight: bold;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: #ff3399;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn:hover {
        background: #e01b82;
      }
      .link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #888;
      }
      .link a {
        color: #ff3399;
        text-decoration: none;
      }
    </style>
    <script src="../../js/components.js"></script>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
  </head>
  <body class="auth-page">
    <div id="site-navbar" data-root="../../"></div>
    <div class="box">
      <h2>Create Account</h2>
      <div id="reg-error" class="error-msg"></div>
      <form onsubmit="handleRegister(event)">
        <div class="input-group">
          <label for="registerName">Full Name</label>
          <input
            type="text"
            id="registerName"
            placeholder="John Doe"
            required
          />
        </div>
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@example.com" required />
        </div>
        <div class="input-group">
          <label for="phoneNumber">Phone Number</label>
          <input type="tel" id="phoneNumber" placeholder="0901234567" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a strong password"
            required
          />
          <div id="password-strength"></div>
        </div>
        <div class="input-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            placeholder="Re-enter your password"
            required
          />
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <div class="link">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
    <script src="../../js/api.js"></script>
    <script>
      const passwordInput = document.getElementById("password");
      const strengthText = document.getElementById("password-strength");
      const confirmPasswordInput = document.getElementById("confirm-password");

      passwordInput.addEventListener("input", function () {
        const val = passwordInput.value;
        if (val.length === 0) {
          strengthText.textContent = "";
          return;
        }
        if (val.length < 8) {
          strengthText.textContent = "Requirement: At least 8 characters";
          strengthText.style.color = "#ff4d4d";
        } else if (!/[A-Z]/.test(val)) {
          strengthText.textContent = "Requirement: At least 1 uppercase letter";
          strengthText.style.color = "#ffa64d";
        } else if (!/[0-9]/.test(val)) {
          strengthText.textContent = "Requirement: At least 1 number";
          strengthText.style.color = "#ffa64d";
        } else if (!/[^A-Za-z0-9]/.test(val)) {
          strengthText.textContent = "Requirement: At least 1 special character (@, #, !, etc.)";
          strengthText.style.color = "#ffa64d";
        } else {
          strengthText.textContent = "Strength: Strong!";
          strengthText.style.color = "#2eb82e";
        }
      });

      confirmPasswordInput.addEventListener("input", function () {
        const errorBox = document.getElementById("reg-error");
        if (confirmPasswordInput.value === "") {
          errorBox.style.display = "none";
          return;
        }
        if (confirmPasswordInput.value !== passwordInput.value) {
          errorBox.textContent = "Passwords do not match! Please check again.";
          errorBox.style.display = "block";
        } else {
          errorBox.style.display = "none";
        }
      });

      async function handleRegister(e) {
        e.preventDefault();
        const fullName = document.getElementById("registerName").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phoneNumber").value.trim();
        const pass = document.getElementById("password").value;
        const confirmPass = document.getElementById("confirm-password").value;
        const errorBox = document.getElementById("reg-error");

        errorBox.style.display = "none";

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          errorBox.textContent = "Invalid email format. Example: name@example.com";
          errorBox.style.display = "block";
          return;
        }
        if (pass.length < 8 || !/[A-Z]/.test(pass) || !/[0-9]/.test(pass) || !/[^A-Za-z0-9]/.test(pass)) {
          errorBox.textContent = "Please meet all password requirements before registering.";
          errorBox.style.display = "block";
          return;
        }
        if (pass !== confirmPass) {
          errorBox.textContent = "Passwords do not match! Please check again.";
          errorBox.style.display = "block";
          return;
        }

        const apiBase = (window.CONCERTLY_API_BASE || "http://localhost:8000/api").replace(/\/$/, "");
        try {
          const response = await fetch(`${apiBase}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email,
              full_name: fullName,
              phone,
              password: pass,
            }),
          });
          const data = await response.json().catch(() => null);
          if (!response.ok) {
            const msg = data?.error?.message || data?.detail?.message || data?.detail || "Registration failed.";
            throw new Error(msg);
          }
          window.location.href = "login.html";
        } catch (error) {
          errorBox.textContent = error.message || "Cannot reach the Concertly server. Please try again later.";
          errorBox.style.display = "block";
        }
      }
    </script>
    <script src="../../js/footer.js"></script>
    <script src="../../js/theme.js"></script>
    <div id="site-footer" data-root="../../"></div>
    <script src="../../js/navbar.js"></script>
  </body>
</html>

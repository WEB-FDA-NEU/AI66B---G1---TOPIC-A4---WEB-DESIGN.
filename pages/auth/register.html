<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Concertly</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <style>
        body { background-color: #0b0b0b; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .box { background: #161616; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #222; margin: 40px 0; }
        h2 { color: #ff3399; text-align: center; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; outline: none; box-sizing: border-box; }
        .input-group input:focus { border-color: #ff3399; }
        .error-msg { background: rgba(255, 51, 153, 0.1); border: 1px solid #ff3399; color: #ff3399; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; display: none; }
        .btn { width: 100%; padding: 12px; background: #ff3399; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #e01b82; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .link a { color: #ff3399; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
        <h2>Create Account</h2>
        <div id="reg-error" class="error-msg"></div>
        <form onsubmit="handleRegister(event)">
            
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="fullname" placeholder="John Doe" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="+1234567890" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required oninput="checkRequirements(this.value)">
                
                <div style="font-size: 13px; color: #aaa; margin-top: 10px; text-align: left; line-height: 1.6;">
                    <div id="req-length">✗ At least 8 characters</div>
                    <div id="req-upper">✗ At least 1 uppercase letter</div>
                    <div id="req-number">✗ At least 1 number</div>
                    <div id="req-special">✗ At least 1 special character (@, $, !, etc.)</div>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Re-enter your password" required>
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" placeholder="name@example.com" required />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a strong password"
            required
          />
        </div>
        <div class="input-group">
          <label>Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            placeholder="Re-enter your password"
            required
          />
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <div class="link">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>

    <script>
        let isPasswordValid = false;

        function checkRequirements(password) {
            const hasLength = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[\W_]/.test(password);

            const updateRequirement = (elementId, isValid, text) => {
                const el = document.getElementById(elementId);
                if (isValid) {
                    el.style.color = '#00ff80'; 
                    el.innerText = '✓ ' + text;
                } else {
                    el.style.color = '#aaa'; 
                    el.innerText = '✗ ' + text;
                }
            };

            updateRequirement('req-length', hasLength, 'At least 8 characters');
            updateRequirement('req-upper', hasUpper, 'At least 1 uppercase letter');
            updateRequirement('req-number', hasNumber, 'At least 1 number');
            updateRequirement('req-special', hasSpecial, 'At least 1 special character (@, $, !, etc.)');

            isPasswordValid = hasLength && hasUpper && hasNumber && hasSpecial;
        }

        function handleRegister(e) {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorBox = document.getElementById('reg-error');

            if (!isPasswordValid) {
                errorBox.innerText = 'Password does not meet the requirements.';
                errorBox.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorBox.innerText = 'Passwords do not match.';
                errorBox.style.display = 'block';
                return;
            }

            let accounts = [];
            try {
                accounts = JSON.parse(localStorage.getItem('concertlyAccounts')) || [];
            } catch (err) {
                accounts = [];
            }


            const emailExists = accounts.some(acc => acc.email.toLowerCase() === email.toLowerCase());
            const phoneExists = accounts.some(acc => acc.phone === phone);

            if (emailExists || phoneExists) {
                errorBox.innerText = 'An account with this email or phone number already exists.';
                errorBox.style.display = 'block';
                return;
            }

            const newAccount = { fullname, email, phone, password };
            accounts.push(newAccount);
            localStorage.setItem('concertlyAccounts', JSON.stringify(accounts));
            localStorage.setItem('concertlyUser', fullname);
            localStorage.setItem('userRole', 'customer');
            
            window.location.href = '../../index.html';
        }

        errorBox.style.display = "none";
        localStorage.setItem("concertlyUser", fullName);
        alert("Account registered successfully!");
        window.location.href = "login.html";
        
    </script>
    <script src="../../js/footer.js"></script>
</body>
</html>

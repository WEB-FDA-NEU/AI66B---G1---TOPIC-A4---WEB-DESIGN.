<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Concertly</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/base.css">
    <style>
        body { background-color: #0b0b0b; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .box { background: #161616; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #222; }
        h2 { color: #ff3399; text-align: center; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; outline: none; }
        .input-group input:focus { border-color: #ff3399; }
        .btn { width: 100%; padding: 12px; background: #ff3399; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #e01b82; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .link a { color: #ff3399; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Sign In</h2>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Email or Username</label>
                <input type="text" id="username" placeholder="name@example.com or admin" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div style="text-align: right; margin-bottom: 15px;">
                <a href="forgot-password.html" style="color: #aaa; font-size: 13px; text-decoration: none;">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            localStorage.setItem('concertlyUser', document.getElementById('username').value);
            // Demo chuyển hướng sang xem vé của concert đầu tiên (id: c1) theo route /me/tickets/{id}
             window.location.href = '../../index.html';
        }
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../js/theme-init.js"></script>
    <title>Login - Concertly</title>
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/auth-background.css" />
    <style>
      body {
        background-color: #0b0b0b;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: sans-serif;
      }
      .box {
        background: #161616;
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        border: 1px solid #222;
      }
      h2 {
        color: #ff3399;
        text-align: center;
        margin-bottom: 24px;
      }
      .input-group {
        margin-bottom: 16px;
      }
      .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #ccc;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #222;
        color: #fff;
        outline: none;
        box-sizing: border-box;
      }
      .input-group input:focus {
        border-color: #ff3399;
      }
      .error-msg {
        background: rgba(255, 51, 153, 0.1);
        border: 1px solid #ff3399;
        color: #ff3399;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 12px;
        display: none;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: #ff3399;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn:hover {
        background: #e01b82;
      }
      .link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #888;
      }
      .link a {
        color: #ff3399;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Sign In</h2>
      <div id="login-error" class="error-msg"></div>
      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <!-- Đổi nhãn thành Email hoặc Số điện thoại -->
          <label>Email or Phone Number</label>
          <input
            type="text"
            id="username"
            placeholder="name@example.com or 0901234567"
            required
          />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <div class="link">
        Don't have an account? <a href="register.html">Register</a>
      </div>
    </div>
    <script>
      async function handleLogin(e) {
        e.preventDefault();

        const usernameInput = document.getElementById("username").value;
        const passwordInput = document.getElementById("password").value;
        const errorBox = document.getElementById("login-error");

        errorBox.style.display = "none";

        // OAuth2 yêu cầu dữ liệu gửi lên dưới dạng form-urlencoded
        const formData = new URLSearchParams();
        formData.append("username", usernameInput); // Biến vẫn phải tên là 'username' theo chuẩn OAuth2
        formData.append("password", passwordInput);

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: formData,
          });

          const data = await response.json();

          if (response.ok) {
            // 1. Lưu token vào trình duyệt
            localStorage.setItem("token", data.access_token);
            
            // 2. Gọi API /api/auth/me để lấy role (quyền) của user vừa đăng nhập
            const meResponse = await fetch("/api/auth/me", {
              headers: {
                "Authorization": `Bearer ${data.access_token}`
              }
            });
            
            if (meResponse.ok) {
              const userData = await meResponse.json();
              
              // 3. Phân luồng chuyển hướng dựa trên role
              if (userData.role === "admin") {
                window.location.href = "../admin/index.html";
              } else {
                const redirect = new URLSearchParams(window.location.search).get("redirect");
                const destination = redirect
                  ? new URL(redirect, window.location.href)
                  : new URL("../../index.html", window.location.href);

                window.location.href =
                  destination.origin === window.location.origin
                    ? destination.href
                    : "../../index.html";
              }
            }
          } else {
            errorBox.textContent = data.detail || "Incorrect email/phone or password.";
            errorBox.style.display = "block";
          }
        } catch (error) {
          console.error("Login error:", error);
          errorBox.textContent = "An error occurred while connecting to the server.";
          errorBox.style.display = "block";
        }
      }
    </script>
    <script src="../../js/theme.js"></script>
  </body>
</html>

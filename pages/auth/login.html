<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../js/theme-init.js"></script>
    <title>Login - Concertly</title>
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/auth-background.css" />
    <style>
      body {
        background-color: #0b0b0b;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: sans-serif;
      }
      .box {
        background: #161616;
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        border: 1px solid #222;
      }
      h2 {
        color: #ff3399;
        text-align: center;
        margin-bottom: 24px;
      }
      .input-group {
        margin-bottom: 16px;
      }
      .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #ccc;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #222;
        color: #fff;
        outline: none;
        box-sizing: border-box;
      }
      .input-group input:focus {
        border-color: #ff3399;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: #ff3399;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn:hover {
        background: #e01b82;
      }
      .login-error {
        margin: 8px 0 0;
        color: #ff6b6b;
        font-size: 14px;
      }
      .link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #888;
      }
      .link a {
        color: #ff3399;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
    <script src="../../js/components.js"></script>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/layout.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
  </head>
  <body class="auth-page">
    <div id="site-navbar" data-root="../../"></div>
    <div class="box">
      <h2>Sign In</h2>
      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="username">Email or Phone Number</label>
          <input
            type="text"
            id="username"
            autocomplete="username"
            placeholder="name@example.com or 0901234567"
            required
          />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </div>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button type="submit" class="btn">Login</button>
      </form>
      <div class="link">
        Don't have an account? <a href="register.html">Register</a>
      </div>
    </div>
    <script src="../../js/api.js"></script>
    <script>
      async function handleLogin(e) {
        e.preventDefault();
        const form = e.target;
        const button = form.querySelector("button[type=submit]");
        const errorBox = document.getElementById("login-error");
        const email = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        errorBox.hidden = true;
        button.disabled = true;
        button.textContent = "Signing in…";
        try {
          const session = await ConcertlyAPI.login(email, password);
          ConcertlyAPI.saveSession(session);
          if (session.user.role === "admin") {
            window.location.href = "../admin/index.html";
            return;
          }
          const redirect = new URLSearchParams(window.location.search).get("redirect");
          const destination = redirect
            ? new URL(redirect, window.location.href)
            : new URL("../../index.html", window.location.href);
          window.location.href =
            destination.origin === window.location.origin ? destination.href : "../../index.html";
        } catch (error) {
          errorBox.textContent =
            error.code === "network"
              ? "Cannot reach the Concertly server. Please try again later."
              : error.message || "Sign in failed.";
          errorBox.hidden = false;
          button.disabled = false;
          button.textContent = "Login";
        }
      }
    </script>
    <script src="../../js/theme.js"></script>
    <div id="site-footer" data-root="../../"></div>
    <script src="../../js/navbar.js"></script>
    <script src="../../js/footer.js"></script>
  </body>
</html>

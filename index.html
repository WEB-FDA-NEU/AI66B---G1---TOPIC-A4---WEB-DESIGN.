<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concertly - Live Music & Stadium Tours</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilitites.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <style>
      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-family);
        margin: 0;
      }

      /* Hero Slider & Drag Styles */
      .hero-slider-wrapper {
        position: relative;
        width: 100%;
        min-height: 75vh;
        overflow: hidden;
        user-select: none;
      }
      .hero-track {
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 75vh;
        transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        cursor: grab;
      }
      .hero-track.dragging {
        transition: none;
        cursor: grabbing;
      }
      .hero-slide {
        flex: 0 0 100%;
        width: 100%;
        min-height: 75vh;
        display: flex;
        align-items: center;
        background-size: cover;
        background-position: center 20%;
        background-repeat: no-repeat;
        position: relative;
        cursor: pointer;
      }
      .hero-slide .container {
        position: relative;
        z-index: 2;
        transform: translateY(48px);
      }
      .carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.85);
        width: 48px;
        height: 48px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition:
          background-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }
      .carousel-btn svg {
        width: 22px;
        height: 22px;
      }
      .carousel-btn:hover {
        color: #fff;
        transform: translateY(-50%) scale(1.18);
      }
      .carousel-btn.prev {
        left: 20px;
      }
      .carousel-btn.next {
        right: 20px;
      }
      .carousel-dots {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }
      .carousel-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .carousel-dot.active {
        background: var(--color-primary);
        width: 26px;
        border-radius: 12px;
      }

      .hero-tag {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background-color: rgba(11, 11, 15, 0.48);
        color: var(--color-primary);
        font-size: var(--font-xs);
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
      }
      .hero-tags {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        flex-wrap: wrap;
        margin-bottom: var(--space-sm);
      }
      .hero-title {
        font-size: clamp(2rem, 4vw, 3.5rem);
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: var(--space-sm);
      }
      .hero-desc {
        color: var(--color-text-secondary);
        max-width: 580px;
        font-size: var(--font-md);
        line-height: 1.6;
        margin-bottom: var(--space-lg);
      }
      .hero-explore {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
        margin-top: var(--space-md);
        color: var(--color-text);
        font-size: var(--font-sm);
        font-weight: 700;
        text-decoration: none;
      }
      .hero-explore:hover {
        color: var(--offer-accent, var(--color-primary-light));
      }
      .hero-explore-arrow {
        color: var(--offer-accent, var(--color-primary));
        font-size: var(--font-lg);
        line-height: 1;
      }
      .hero-offer {
        position: relative;
        left: auto;
        top: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 520px;
        margin-top: var(--space-md);
        padding: 14px 0 0 18px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: var(--radius-md);
        color: var(--color-text);
      }
      .hero-offer::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 64px;
        height: 3px;
        background: var(--offer-accent, var(--color-primary));
        transform: skewX(-28deg);
        transform-origin: left center;
      }
      .hero-offer strong {
        color: var(--offer-accent, var(--color-primary-light));
        font-size: clamp(1.5rem, 3vw, 2.25rem);
        line-height: 1;
        letter-spacing: 0;
      }
      .hero-offer span {
        color: var(--color-text-secondary);
        font-size: var(--font-sm);
      }
      .hero-offer .offer-kicker {
        color: var(--color-text);
        font-size: var(--font-xs);
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .header-search {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        width: 280px;
        padding: 4px 6px 4px 12px;
        gap: var(--space-xs);
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
        border-radius: 999px;
      }
      .header-search:focus-within {
        border-color: var(--color-primary);
      }
      .header-search-input {
        width: 100%;
        min-width: 0;
        padding: 6px 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--color-text);
        font: inherit;
        font-size: var(--font-xs);
      }
      .header-search-input::placeholder {
        color: var(--color-text-muted);
      }
      .header-search-button {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--color-primary);
        color: #fff;
        cursor: pointer;
      }
      .header-search-button svg {
        width: 14px;
        height: 14px;
      }
      .home-search {
        padding: var(--space-2xl) 0 var(--space-md);
      }
      .home-search-kicker {
        margin-bottom: var(--space-xs);
        color: var(--color-primary);
        font-size: var(--font-xs);
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .home-search-title {
        margin-bottom: var(--space-md);
        font-size: clamp(1.5rem, 3vw, 2.25rem);
        line-height: 1.15;
      }
      .home-search-form {
        display: flex;
        max-width: 720px;
        padding: 6px;
        gap: var(--space-sm);
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border-light);
        border-radius: var(--radius-md);
      }
      .home-search-input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--color-text);
        font: inherit;
      }
      .home-search-input::placeholder {
        color: var(--color-text-muted);
      }
      .hero-actions {
        display: flex;
        gap: var(--space-md);
        flex-wrap: wrap;
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: var(--space-xl);
        padding-top: var(--space-xl);
      }
      .section-title {
        font-size: clamp(28px, 3.2vw, 36px);
        font-weight: 800;
        margin-bottom: 6px;
      }
      .concert-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: var(--space-lg);
        margin-bottom: var(--space-xl);
      }
      .card {
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.25s ease,
          border-color 0.25s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: var(--color-primary);
      }
      .concert-card {
        cursor: pointer;
      }
      .concert-card:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 3px;
      }
      .card-img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        display: block;
      }
      .card-body {
        padding: var(--space-md);
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .card-badge {
        align-self: flex-start;
        font-size: var(--font-xs);
        font-weight: 600;
        color: var(--color-primary);
        margin-bottom: var(--space-xs);
      }
      .card-title {
        font-size: var(--font-md);
        font-weight: 700;
        margin-bottom: 4px;
        color: var(--color-text);
        text-decoration: none;
      }
      .card-meta {
        font-size: var(--font-sm);
        color: var(--color-text-secondary);
        margin-bottom: var(--space-sm);
      }
      .card-footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: var(--space-sm);
        border-top: 1px solid var(--color-border);
      }
      .card-price {
        margin-left: auto;
        font-weight: 700;
        color: var(--color-text);
        font-size: var(--font-sm);
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="site-logo hover-glow">CONCERTLY</a>
        <div class="header-actions" data-home="index.html">
          <nav class="site-nav">
            <a href="index.html" class="active hover-glow" data-nav>Home</a>
            <a href="pages/concerts/index.html" class="hover-glow" data-nav
              >Explore</a
            >
            <a href="pages/404.html" class="hover-glow" data-nav>Support</a>
            <span class="nav-indicator"></span>
          </nav>
          <form
            class="header-search"
            action="pages/concerts/index.html"
            method="get"
            role="search"
          >
            <input
              class="header-search-input"
              type="search"
              name="search"
              placeholder="Find your next live show..."
              aria-label="Search concerts"
            />
            <button
              class="header-search-button"
              type="submit"
              aria-label="Search"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-4-4"></path>
              </svg>
            </button>
          </form>
          <div class="site-auth">
            <button
              class="avatar-button"
              type="button"
              aria-label="Account menu"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5.5 20c.8-3.2 3.1-5 6.5-5s5.7 1.8 6.5 5"></path>
              </svg>
            </button>
            <div class="auth-menu" role="menu">
              <a href="pages/auth/login.html" data-auth-login role="menuitem"
                >Sign in</a
              >
              <a href="pages/auth/register.html" role="menuitem">Sign up</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Hero Slider Section with Drag/Swipe Support -->
    <section class="hero-slider-wrapper" id="hero-wrapper">
      <button
        class="carousel-btn prev"
        id="hero-prev"
        aria-label="Previous Slide"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="hero-track" id="hero-track">
        <!-- Injected via js/main.js -->
      </div>
      <button class="carousel-btn next" id="hero-next" aria-label="Next Slide">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <div class="carousel-dots" id="hero-dots"></div>
    </section>

    <!-- Main Content: Concert Grid -->
    <main class="container">
      <div class="section-header">
        <div>
          <h2 class="section-title">Trending Shows</h2>
          <p
            style="
              color: var(--color-text-secondary);
              margin: 0;
              font-size: var(--font-sm);
            "
          >
            Discover the hottest stadium concerts and showcases
          </p>
        </div>
        <a
          href="pages/concerts/index.html"
          class="hover-glow"
          style="
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: var(--font-sm);
          "
          >View All &rarr;</a
        >
      </div>

      <div class="concert-grid" id="concert-list">
        <!-- Injected via js/main.js -->
      </div>
    </main>

    <div id="site-footer" data-root=""></div>
    <script src="js/footer.js"></script>

    <!-- Scripts -->
    <script src="js/mock-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
